name: Agentic Workflow Compile Check

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/*.md"
      - ".github/workflows/*.lock.yml"
      - ".github/workflows/agentics-maintenance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aw-compile-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-aw-compiled-files:
    name: Verify gh aw compile outputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-aw CLI
        uses: github/gh-aw-actions/setup-cli@6aab9e5b5c91c615506061f09bedd81a23babe3c # v0.86.2 https://github.com/github/gh-aw-actions
        with:
          version: v0.86.2

      - name: Recompile workflows
        run: gh aw compile

      - name: Fail on stale generated workflow files
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- '.github/workflows/*.lock.yml' .github/workflows/agentics-maintenance.yml; then
            echo "::error title=Stale Agentic Workflow compile outputs::Detected generated workflow changes after 'gh aw compile'."
            echo "::error::Run 'gh aw compile' locally and commit updated .lock.yml / agentics-maintenance.yml files."
            echo "Changed generated files:"
            git --no-pager diff --stat -- '.github/workflows/*.lock.yml' .github/workflows/agentics-maintenance.yml
            echo "::group::Full diff"
            git --no-pager diff -- '.github/workflows/*.lock.yml' .github/workflows/agentics-maintenance.yml
            echo "::endgroup::"
            exit 1
          fi
