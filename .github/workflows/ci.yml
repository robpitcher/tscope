name: CI

on:
  # Push runs on main keep the README CI badge (?branch=main) reporting a real status;
  # pull_request runs are not attributed to the main branch.
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.changeset/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.changeset/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test (Node ${{ matrix.node-version }})
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    uses: ./.github/workflows/verify.yml
    with:
      node-version: ${{ matrix.node-version }}
      upload-coverage: true
